# The product's search space: the keys the economy's goals respond to. See "The tuning system" in
# docs/simulation.md.
#
# The three energy tiers below do not overlap (2-3, 4-7, 8-11) and sit under the last tier, 12, so
# every draw keeps the cost table increasing, see ADR-0048. The Counter's sell and buy percentages
# overlap only at 100, which the config allows.
params:
  - {path: counter_sell_pct, type: int, min: 40, max: 100}
  - {path: counter_buy_pct, type: int, min: 100, max: 200}
  - {path: counter_foil_pct, type: int, min: 200, max: 800}
  - {path: counter_shelf_days, type: int, min: 0, max: 60}
  - {path: counter_supply.boosters_per_day, type: int, min: 1, max: 60, scale: log}
  - {path: npcs.population, type: int, min: 0, max: 60}
  - {path: initial_stock.rare, type: int, min: 0, max: 6}
  - {path: daily_reward, type: int, min: 5, max: 200, scale: log}
  - {path: energy.recharge_per_tick, type: int, min: 1, max: 3}
  - {path: energy.reserve_cap, type: int, min: 4, max: 20}
  - {path: "energy.cost_table[0].cost", type: int, min: 2, max: 3}
  - {path: "energy.cost_table[1].cost", type: int, min: 4, max: 7}
  - {path: "energy.cost_table[2].cost", type: int, min: 8, max: 11}
