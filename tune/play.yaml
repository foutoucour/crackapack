# The overlay crackapack play applies on top of base.yaml, and the search does not: overrides in the
# form of the search's candidates. The game wants a Counter that can miss a card, so that a rare is
# something to watch for: nothing sold or opened lasts forever, and the rares and mythics reach the
# Counter only through its daily boosters and the player's sales. The values and why they were
# chosen are in docs/tuning-log.md.
- {path: counter_shelf_days, value: 28}
- {path: initial_stock.rare, value: 0}
- {path: initial_stock.mythic, value: 0}
